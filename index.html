<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VelozTest — Speed Check</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050508;
      --panel: #0d0d14;
      --border: #1a1a2e;
      --accent: #00f5a0;
      --accent2: #00c8f5;
      --warn: #f5a000;
      --danger: #f54040;
      --text: #e8e8f0;
      --muted: #55556a;
      --glow: rgba(0, 245, 160, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,245,160,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,160,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: gridPan 25s linear infinite;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(0,245,160,0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    @keyframes gridPan {
      0% { transform: translateY(0); }
      100% { transform: translateY(48px); }
    }

    /* Header */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      background: rgba(5,5,8,0.7);
      backdrop-filter: blur(12px);
    }

    .logo {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: var(--accent);
      text-transform: uppercase;
      text-shadow: 0 0 20px var(--glow);
    }

    .logo span { color: var(--text); }

    .header-info {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      text-align: right;
      line-height: 1.6;
    }

    /* Main container */
    main {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 20px;
    }

    /* Speedometer ring */
    .speed-ring-container {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .speed-ring-container svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: var(--border);
      stroke-width: 6;
    }

    .ring-progress {
      fill: none;
      stroke: url(#ringGrad);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 785;
      stroke-dashoffset: 785;
      transition: stroke-dashoffset 0.15s linear;
      filter: drop-shadow(0 0 8px var(--accent));
    }

    .speed-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .speed-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 4.5rem;
      font-weight: 600;
      color: var(--accent);
      line-height: 1;
      text-shadow: 0 0 30px var(--glow), 0 0 60px rgba(0,245,160,0.1);
      letter-spacing: -2px;
      transition: color 0.3s ease;
    }

    .speed-unit {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .speed-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 8px;
    }

    /* Status indicator */
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: all 0.3s ease;
    }

    .status-dot.active {
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      animation: pulse 1s ease-in-out infinite;
    }

    .status-dot.done {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.6; }
    }

    /* Stats grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 520px;
    }

    .stat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.4s ease, transform 0.4s ease, border-color 0.3s ease;
    }

    .stat-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .stat-card:hover { border-color: rgba(0,245,160,0.3); }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .stat-card.lit::before { opacity: 1; }

    .stat-icon {
      font-size: 1rem;
      margin-bottom: 2px;
    }

    .stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1;
    }

    .stat-lbl {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    /* Progress bar */
    .progress-wrap {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-bar {
      height: 3px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      transition: width 0.2s linear;
      box-shadow: 0 0 12px var(--accent);
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
    }

    /* Button */
    .btn-start {
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 14px 48px;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.25s ease;
    }

    .btn-start::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s ease;
      z-index: -1;
    }

    .btn-start:hover {
      color: var(--bg);
      box-shadow: 0 0 30px var(--glow);
    }

    .btn-start:hover::before { transform: scaleX(1); }

    .btn-start:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Rating badge */
    .rating-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      border-radius: 99px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      border: 1px solid;
      opacity: 0;
      transform: scale(0.9);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .rating-badge.show {
      opacity: 1;
      transform: scale(1);
    }

    .rating-badge.excellent { border-color: var(--accent); color: var(--accent); background: rgba(0,245,160,0.08); }
    .rating-badge.good { border-color: var(--accent2); color: var(--accent2); background: rgba(0,200,245,0.08); }
    .rating-badge.average { border-color: var(--warn); color: var(--warn); background: rgba(245,160,0,0.08); }
    .rating-badge.poor { border-color: var(--danger); color: var(--danger); background: rgba(245,64,64,0.08); }

    /* Footer */
    footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 32px;
      padding: 16px 40px;
      border-top: 1px solid var(--border);
      background: rgba(5,5,8,0.7);
      backdrop-filter: blur(12px);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
    }

    .footer-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--muted);
    }

    /* Animated scan line */
    .scan-line {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0;
      z-index: 200;
      animation: none;
    }

    .scan-line.running {
      opacity: 0.6;
      animation: scan 2s linear infinite;
    }

    @keyframes scan {
      0% { transform: translateY(0); }
      100% { transform: translateY(100vh); }
    }

  </style>
</head>
<body>

<div class="scan-line" id="scanLine"></div>

<header>
  <div class="logo">Veloz<span>Test</span></div>
  <div class="header-info" id="connectionInfo">
    IP: — &nbsp; ISP: —<br>
    Servidor: —
  </div>
</header>

<main>
  <div class="speed-ring-container">
    <svg viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#00f5a0" />
          <stop offset="100%" stop-color="#00c8f5" />
        </linearGradient>
      </defs>
      <circle class="ring-bg" cx="140" cy="140" r="125" />
      <circle class="ring-progress" id="ringProgress" cx="140" cy="140" r="125" />
    </svg>
    <div class="speed-center">
      <div class="speed-value" id="speedValue">—</div>
      <div class="speed-unit">Mbps</div>
      <div class="speed-label" id="speedLabel">Descarga</div>
    </div>
  </div>

  <div class="status" id="statusEl">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Listo para iniciar</span>
  </div>

  <div class="stats-grid">
    <div class="stat-card" id="card-down">
      <div class="stat-icon">↓</div>
      <div class="stat-val" id="dl-val">—</div>
      <div class="stat-lbl">Descarga Mbps</div>
    </div>
    <div class="stat-card" id="card-up">
      <div class="stat-icon">↑</div>
      <div class="stat-val" id="ul-val">—</div>
      <div class="stat-lbl">Subida Mbps</div>
    </div>
    <div class="stat-card" id="card-ping">
      <div class="stat-icon">◈</div>
      <div class="stat-val" id="ping-val">—</div>
      <div class="stat-lbl">Ping ms</div>
    </div>
    <div class="stat-card" id="card-jitter">
      <div class="stat-icon">≈</div>
      <div class="stat-val" id="jitter-val">—</div>
      <div class="stat-lbl">Jitter ms</div>
    </div>
    <div class="stat-card" id="card-loss">
      <div class="stat-icon">▽</div>
      <div class="stat-val" id="loss-val">—</div>
      <div class="stat-lbl">Pérd. paquetes</div>
    </div>
    <div class="stat-card" id="card-buf">
      <div class="stat-icon">⬡</div>
      <div class="stat-val" id="buf-val">—</div>
      <div class="stat-lbl">Bufferbloat</div>
    </div>
  </div>

  <div class="progress-wrap" id="progressWrap" style="display:none">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-info">
      <span id="progressPhase">Iniciando…</span>
      <span id="progressPct">0%</span>
    </div>
  </div>

  <div class="rating-badge" id="ratingBadge"></div>

  <button class="btn-start" id="startBtn" onclick="runTest()">Iniciar Test</button>
</main>

<footer>
  <div class="footer-item"><div class="footer-dot"></div> VelozTest v2.4</div>
  <div class="footer-item"><div class="footer-dot"></div> WebRTC Simulation</div>
  <div class="footer-item"><div class="footer-dot"></div> <span id="footerTime"></span></div>
</footer>

<script>
  // Update clock
  function updateClock() {
    const now = new Date();
    document.getElementById('footerTime').textContent =
      now.toLocaleTimeString('es-ES', { hour12: false });
  }
  updateClock();
  setInterval(updateClock, 1000);

  // Simulate connection info
  const isps = ['Claro Fibra', 'Telmex', 'Movistar', 'Izzi', 'AT&T Mexico', 'Totalplay'];
  const servers = ['Ciudad de México', 'Guadalajara', 'Monterrey', 'Miami FL'];

  function randomIP() {
    return `${rnd(100,200)}.${rnd(0,255)}.${rnd(0,255)}.${rnd(1,254)}`;
  }

  function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function rndF(min, max, dec=1) { return (Math.random() * (max - min) + min).toFixed(dec); }

  // Ring progress
  const CIRCUMFERENCE = 2 * Math.PI * 125; // ≈785
  function setRing(pct) {
    const offset = CIRCUMFERENCE - (pct / 100) * CIRCUMFERENCE;
    document.getElementById('ringProgress').style.strokeDashoffset = offset;
  }

  // Speed color
  function setSpeedColor(mbps) {
    const el = document.getElementById('speedValue');
    if (mbps >= 100) el.style.color = 'var(--accent)';
    else if (mbps >= 30) el.style.color = 'var(--accent2)';
    else if (mbps >= 10) el.style.color = 'var(--warn)';
    else el.style.color = 'var(--danger)';
  }

  function setStatus(text, active = false, done = false) {
    document.getElementById('statusText').textContent = text;
    const dot = document.getElementById('statusDot');
    dot.className = 'status-dot' + (active ? ' active' : done ? ' done' : '');
  }

  function showCard(id, delay = 0) {
    setTimeout(() => {
      const c = document.getElementById(id);
      c.classList.add('visible');
      setTimeout(() => c.classList.add('lit'), 300);
    }, delay);
  }

  function setProgress(pct, phase) {
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressPct').textContent = Math.round(pct) + '%';
    document.getElementById('progressPhase').textContent = phase;
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  async function animateValue(elementId, from, to, duration, suffix = '') {
    const el = document.getElementById(elementId);
    const steps = 40;
    const step = (to - from) / steps;
    const delay = duration / steps;
    let current = from;
    for (let i = 0; i < steps; i++) {
      current += step;
      el.textContent = Math.round(current) + suffix;
      await sleep(delay);
    }
    el.textContent = Math.round(to) + suffix;
  }

  async function animateSpeed(from, to, duration) {
    const el = document.getElementById('speedValue');
    const steps = 60;
    const step = (to - from) / steps;
    const delay = duration / steps;
    let current = from;
    for (let i = 0; i < steps; i++) {
      current = Math.max(0, current + step + (Math.random() - 0.5) * 5);
      el.textContent = Math.max(0, current).toFixed(1);
      setRing((current / 300) * 100);
      setSpeedColor(current);
      await sleep(delay);
    }
    el.textContent = to.toFixed(1);
    setRing((to / 300) * 100);
    setSpeedColor(to);
  }

  function getRating(dl) {
    if (dl >= 100) return { label: '⚡ Excelente', cls: 'excellent' };
    if (dl >= 50)  return { label: '✓ Buena', cls: 'good' };
    if (dl >= 15)  return { label: '◎ Aceptable', cls: 'average' };
    return { label: '⚠ Lenta', cls: 'poor' };
  }

  async function runTest() {
    const btn = document.getElementById('startBtn');
    const badge = document.getElementById('ratingBadge');
    const progress = document.getElementById('progressWrap');
    const scanLine = document.getElementById('scanLine');

    // Reset
    btn.disabled = true;
    badge.className = 'rating-badge';
    badge.textContent = '';
    document.getElementById('speedValue').textContent = '0';
    document.getElementById('speedValue').style.color = 'var(--accent)';
    setRing(0);
    document.getElementById('dl-val').textContent = '—';
    document.getElementById('ul-val').textContent = '—';
    document.getElementById('ping-val').textContent = '—';
    document.getElementById('jitter-val').textContent = '—';
    document.getElementById('loss-val').textContent = '—';
    document.getElementById('buf-val').textContent = '—';

    ['card-down','card-up','card-ping','card-jitter','card-loss','card-buf'].forEach(id => {
      const c = document.getElementById(id);
      c.classList.remove('visible','lit');
    });

    // Show connection info
    document.getElementById('connectionInfo').innerHTML =
      `IP: ${randomIP()} &nbsp; ISP: ${isps[rnd(0,isps.length-1)]}<br>Servidor: ${servers[rnd(0,servers.length-1)]}`;

    progress.style.display = 'flex';
    scanLine.classList.add('running');

    // ── PHASE 1: PING ──────────────────────────────────
    setStatus('Midiendo latencia…', true);
    document.getElementById('speedLabel').textContent = 'Ping';
    setProgress(5, 'Calculando ping…');

    const pingVal = rnd(4, 35);
    const jitterVal = rnd(1, 12);
    const lossVal = (Math.random() < 0.3 ? rndF(0.1, 1.5) : '0.0');

    for (let i = 0; i <= 100; i += 10) {
      await sleep(60);
      setProgress(5 + i * 0.1, 'Calculando ping…');
      document.getElementById('speedValue').textContent = Math.round(i * pingVal / 100);
      setRing(i * 0.3);
    }

    document.getElementById('speedValue').textContent = pingVal;
    document.getElementById('ping-val').textContent = pingVal + ' ms';
    document.getElementById('jitter-val').textContent = jitterVal + ' ms';
    document.getElementById('loss-val').textContent = lossVal + '%';
    setRing(15);
    showCard('card-ping', 0);
    showCard('card-jitter', 150);
    showCard('card-loss', 300);
    await sleep(600);

    // ── PHASE 2: DOWNLOAD ──────────────────────────────
    setStatus('Midiendo descarga…', true);
    document.getElementById('speedLabel').textContent = 'Descarga';
    setProgress(15, 'Test de descarga…');

    const dlTarget = rnd(30, 280);
    await animateSpeed(0, dlTarget, 3000);

    // Ramp progress bar during download
    for (let p = 15; p <= 60; p += 1) {
      await sleep(25);
      setProgress(p, 'Test de descarga…');
    }

    document.getElementById('dl-val').textContent = dlTarget + ' Mbps';
    showCard('card-down', 0);
    setStatus('Descarga completa', false, true);
    await sleep(500);

    // ── PHASE 3: UPLOAD ────────────────────────────────
    setStatus('Midiendo subida…', true);
    document.getElementById('speedLabel').textContent = 'Subida';
    setProgress(62, 'Test de subida…');

    const ulTarget = Math.round(dlTarget * rndF(0.3, 0.7));
    await animateSpeed(dlTarget, ulTarget, 2500);

    for (let p = 62; p <= 95; p += 1) {
      await sleep(20);
      setProgress(p, 'Test de subida…');
    }

    document.getElementById('ul-val').textContent = ulTarget + ' Mbps';
    showCard('card-up', 0);

    // Bufferbloat grade
    const bbGrades = ['A', 'A+', 'B', 'C'];
    const bb = pingVal < 15 ? bbGrades[rnd(0,1)] : bbGrades[rnd(1,3)];
    document.getElementById('buf-val').textContent = bb;
    showCard('card-buf', 200);

    // ── FINISH ─────────────────────────────────────────
    setProgress(100, 'Test completado');
    await sleep(300);

    // Show final download speed
    document.getElementById('speedValue').textContent = dlTarget.toFixed(1);
    document.getElementById('speedLabel').textContent = 'Descarga';
    setRing((dlTarget / 300) * 100);
    setSpeedColor(dlTarget);

    setStatus('Test completado', false, true);
    scanLine.classList.remove('running');
    progress.style.display = 'none';

    // Rating
    const rating = getRating(dlTarget);
    badge.textContent = rating.label;
    badge.className = 'rating-badge ' + rating.cls;
    setTimeout(() => badge.classList.add('show'), 100);

    btn.disabled = false;
    btn.textContent = 'Repetir Test';
  }
</script>
</body>
</html>
